name: Publicar imagen en Docker Hub

# Solo cuando algo llega a main (una PR ya revisada por el CI) o se crea un tag de versión.
# Nunca en las PR: así los secretos no se usan con código sin revisar.
on:
  push:
    branches: [main]
    tags: ["v*"]

# Una publicación a la vez por rama o tag
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publicar:
    name: Construir y publicar en Docker Hub
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4
        with:
          # Historial completo: hace falta para comprobar que un tag viene de main
          fetch-depth: 0

      # Un tag se puede poner sobre cualquier commit; solo se publica si ese commit ya está en main
      # (es decir, si pasó por una PR con el CI en verde)
      - name: Comprobar que el tag apunta a código ya fusionado en main
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::El tag $GITHUB_REF_NAME apunta a un commit que no está en main; no se publica."
            exit 1
          fi

      - uses: docker/setup-buildx-action@v3

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Etiquetas: latest y el commit en main; la versión (v0.2.0 → 0.2.0) en los tags
      - name: Calcular nombre y etiquetas de la imagen
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/valvedex
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=short
            type=semver,pattern={{version}}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: COMMIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Staging: cada cambio que llega a main se despliega aquí para validarlo antes de una versión.
  # Requiere el entorno «staging» de GitHub con el secreto RENDER_DEPLOY_HOOK y la variable STAGING_URL.
  staging:
    name: Desplegar en staging (Render)
    needs: publicar
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: ${{ vars.STAGING_URL }}
    steps:
      - name: Pedir el despliegue a Render
        id: desplegar
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::Falta el secreto RENDER_DEPLOY_HOOK del entorno staging; no se despliega ni se comprueba."
            echo "pedido=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$DEPLOY_HOOK"
          echo "pedido=true" >> "$GITHUB_OUTPUT"

      # Render tarda un rato en bajar la imagen y arrancarla. Un 200 no basta (la versión anterior
      # también lo daría): se espera a que /version devuelva el commit que acaba de publicarse.
      - name: Comprobar que staging ejecuta esta versión
        if: steps.desplegar.outputs.pedido == 'true'
        env:
          URL: ${{ vars.STAGING_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Se pidió el despliegue pero falta la variable STAGING_URL: no se puede comprobar."
            exit 1
          fi
          for intento in $(seq 1 40); do
            commit=$(curl --fail --silent "$URL/version" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "Staging ejecuta el commit $GITHUB_SHA en $URL"
              exit 0
            fi
            echo "Intento $intento: staging devuelve «${commit:-sin respuesta}»; se reintenta en 15 s"
            sleep 15
          done
          echo "::error::Staging no ejecuta el commit $GITHUB_SHA en $URL"
          exit 1

  # Producción: solo al crear un tag de versión. El entorno «production» de GitHub exige la
  # aprobación manual de Manuel antes de que este trabajo empiece. Despliega la imagen de ESA versión.
  produccion:
    name: Desplegar en producción (Render)
    needs: publicar
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    steps:
      - name: Pedir a Render la imagen de esta versión
        id: desplegar
        env:
          DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          if [ -z "$DEPLOY_HOOK" ]; then
            echo "::warning::Falta el secreto RENDER_DEPLOY_HOOK del entorno production; no se despliega ni se comprueba."
            echo "pedido=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          version="${GITHUB_REF_NAME#v}"
          imagen="docker.io%2F${DOCKERHUB_USERNAME}%2Fvalvedex%3A${version}"
          curl --fail --silent --show-error --request POST "${DEPLOY_HOOK}&imgURL=${imagen}"
          echo "pedido=true" >> "$GITHUB_OUTPUT"

      # Se espera a que /version devuelva el commit del tag: un 200 también lo daría la versión anterior
      - name: Comprobar que producción ejecuta esta versión
        if: steps.desplegar.outputs.pedido == 'true'
        env:
          URL: ${{ vars.PRODUCTION_URL }}
        run: |
          if [ -z "$URL" ]; then
            echo "::error::Se pidió el despliegue pero falta la variable PRODUCTION_URL: no se puede comprobar."
            exit 1
          fi
          for intento in $(seq 1 40); do
            commit=$(curl --fail --silent "$URL/version" | sed -n 's/.*"commit":"\([^"]*\)".*/\1/p' || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "Producción ejecuta el commit $GITHUB_SHA en $URL"
              exit 0
            fi
            echo "Intento $intento: producción devuelve «${commit:-sin respuesta}»; se reintenta en 15 s"
            sleep 15
          done
          echo "::error::Producción no ejecuta el commit $GITHUB_SHA en $URL"
          exit 1
