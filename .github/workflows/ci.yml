name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Si subes otro commit a la misma rama, se cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Solo lectura del repositorio: este workflow no publica nada
permissions:
  contents: read

jobs:
  calidad:
    name: Calidad (lint, tipos, formato y pruebas)
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Preparar Node.js 24 con caché de npm
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias (exactamente el lockfile)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      - name: Tipos (TypeScript)
        run: npm run typecheck

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Pruebas (Vitest)
        run: npm run test

  build:
    name: Build de Next.js
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build

  docker:
    name: Imagen de Docker
    needs: calidad
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Construir la imagen (sin publicarla)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
