# Configuración del análisis de SonarCloud. Las claves no son secretas; el token va en el secreto SONAR_TOKEN de GitHub.
sonar.organization=manuelklk03
sonar.projectKey=Manuelklk03_ValveDex
sonar.projectName=ValveDex

# Qué analizar: el código de la web y los scripts; las pruebas se tratan como pruebas, no como código de producto
sonar.sources=src,scripts
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx
sonar.exclusions=**/*.test.ts,**/*.test.tsx

# Los archivos de datos (fichas, lore) repiten estructura a propósito: no cuentan como código duplicado
sonar.cpd.exclusions=src/data/**

sonar.sourceEncoding=UTF-8
