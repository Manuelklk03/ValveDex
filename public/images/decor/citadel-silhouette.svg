<svg width="300" height="400" viewBox="0 0 300 400" xmlns="http://www.w3.org/2000/svg">
  <!-- Silueta simplificada de la Ciudadela de Half-Life 2 -->
  <path d="M150 0 L170 180 H130 Z" fill="currentColor" opacity="0.3"/>
  <rect x="80" y="180" width="140" height="220" rx="70" fill="currentColor" opacity="0.2"/>
  <circle cx="150" cy="180" r="30" fill="currentColor" opacity="0.25"/>
  <!-- Detalles de la Ciudadela -->
  <rect x="110" y="120" width="80" height="20" fill="currentColor" opacity="0.2"/>
  <rect x="100" y="145" width="100" height="15" fill="currentColor" opacity="0.15"/>
  <!-- Torres laterales -->
  <rect x="60" y="200" width="20" height="200" fill="currentColor" opacity="0.2"/>
  <rect x="220" y="200" width="20" height="200" fill="currentColor" opacity="0.2"/>
</svg>